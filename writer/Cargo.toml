[package]
name = "writer"     # docx互換のワープロ。calc とは別のソフト
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
# HTML の https(公開 Web も見える — 発注者 2026-08-04)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# HTML の文字コード(CP932 の実物を読むため)
encoding_rs = "0.8"
# デジタル署名(隣の .sig への添え書き。Ed25519)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
kumihan = { path = "../engine" }
ui = { path = "../ui" }
ooxml = { path = "../ooxml" }
paper = { path = "../paper" }
# GPUI は crates.io に無いので、版を固定して zed から直に取る
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5e1fd392f67e27fa1da91bad43eef7db1a5dec23", features = ["wayland", "x11"] }
rfd = "0.14"
