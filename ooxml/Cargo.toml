[package]
name = "ooxml"      # K3: docx ⇄ kumihan の文書モデル。互換は書式の境界で守る
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "OOXML(docx)の読み書き。全部は実装しない — 読めないものは読めないと言う"

[dependencies]
kumihan = { path = "../engine" }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
# 暗号化(ECMA-376 Standard Encryption)。cfb は複合ファイルの容れ物
cfb = "0.10"
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"   # Agile 方式(2013+ の既定)は SHA-512

[dev-dependencies]
sheet = { path = "../sheet" }
printpdf = "0.7"
