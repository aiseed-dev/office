<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>03 箇条書き</title></head>
<body>

<h1>受入 03: 箇条書き・番号リスト・入れ子</h1>

<p>印(・)の箇条書き。3項目、どれも1行:</p>

<ul>
<li>鉛筆と消しゴム</li>
<li>ノートと下敷き</li>
<li>はさみとのり</li>
</ul>

<p>番号のリスト。1. 2. 3. と数えること:</p>

<ol>
<li>朝、店を開ける</li>
<li>昼、注文をまとめる</li>
<li>夕、台帳を締める</li>
</ol>

<p>入れ子(1段深い項目が字下げされること)。li の閉じは省いてある:</p>

<ul>
<li>筆記具
  <ul>
  <li>ボールペン
  <li>シャープペン
  </ul>
<li>紙製品
</ul>

<p>リストのあとの段落。字下げが戻っていること。</p>

</body>
</html>
