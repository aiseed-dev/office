<!DOCTYPE html>
<html lang="ja">
<head><meta charset="shift_jis"><title>90 文字コード</title></head>
<body>
<h1>受入 90: CP932 の頁は正直に断ること</h1>
<p>この頁はわざと CP932(Shift_JIS)で保存してある。UTF-8 しか
読まない段階の writer は、化けた字を見せずに「読めない(文字コードが
UTF-8 でない)」と言って止まれば合格。黙って豆腐を並べたら不合格。</p>
<p>丸数字や機種依存文字も入れてある: ①②③ 髙 﨑</p>
</body>
</html>
